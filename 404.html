<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — 拾事 PickDone</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/logo-64.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f9fa; color: #22262e; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #e8eaed; } }
  .card { max-width: 480px; }
  .code { font-size: 88px; font-weight: 800; letter-spacing: 4px; color: #0f9d8f; line-height: 1; }
  h1 { font-size: 20px; margin: 18px 0 8px; }
  p { font-size: 14.5px; color: #6b7280; margin: 0 0 26px; }
  a.btn {
    display: inline-block; padding: 10px 26px; border-radius: 999px; text-decoration: none;
    background: #0f9d8f; color: #fff; font-size: 14.5px; font-weight: 600;
  }
  a.alt { margin-left: 12px; color: inherit; font-size: 14.5px; }
  img.logo { width: 44px; height: 44px; margin-bottom: 18px; }
</style>
  <script>if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    // 打开/刷新一律从页顶开始,并压制两类浏览器原生下滚:①历史/锚点定位 ②demo iframe 子框架加载时
    // Chromium 触发的父文档重定位(无 JS 调用方,实测必跳)。用户一旦主动滚动(滚轮/触摸/按键)立即放行。
    ;(function () {
      var pinned = true
      ;['wheel', 'touchstart', 'keydown'].forEach(function (t) {
        addEventListener(t, function () { pinned = false }, { capture: true, passive: true, once: true })
      })
      window.__releaseScrollPin = function () { pinned = false }
      function pin () {
        if (!pinned) return
        // 必须瞬时赋值:html 有 scroll-behavior:smooth,scrollTo() 平滑动画会被 iframe 聚焦引发的原生定位反复打断
        var se = document.scrollingElement || document.documentElement
        if (se.scrollTop !== 0) se.scrollTop = 0
      }
      addEventListener('scroll', pin, { capture: true, passive: true })
      var n = 0
      var iv = setInterval(function () {
        pin()
        var f = document.querySelector('.demo-frame iframe')
        if (++n > 50 || (f && f.hasAttribute('data-demo-loaded'))) { clearInterval(iv); setTimeout(function () { clearInterval(iv) }, 400) }
      }, 100)
      document.addEventListener('DOMContentLoaded', function () {
        var f = document.querySelector('.demo-frame iframe')
        if (f) f.addEventListener('load', function () { f.setAttribute('data-demo-loaded', '') })
      })
    })()</script>
</head>
<body>
<div class="card">
  <img class="logo" src="/assets/img/logo.png" alt="">
  <div class="code">404</div>
  <h1 id="t">页面走丢了</h1>
  <p id="d">这个地址不存在或已被移动。</p>
  <a class="btn" href="/" id="h">返回首页</a>
  <script>
    ;(function () {
      var en = false
      try {
        var saved = localStorage.getItem('pd-lang')
        en = saved ? saved === 'en' : (navigator.language || '').indexOf('en') === 0
      } catch (e) { en = (navigator.language || '').indexOf('en') === 0 }
      if (!en) return
      document.getElementById('t').textContent = 'Page not found'
      document.getElementById('d').textContent = "This address doesn't exist or has moved."
      document.getElementById('h').textContent = 'Back to home'
    })()
  </script>
  <a class="alt" href="https://github.com/ardss/pickdone" rel="noopener">GitHub →</a>
</div>
</body>
</html>
